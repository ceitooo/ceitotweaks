# Deja en el repo solo la última versión publicada: cada vez que sale una
# nueva se borran las anteriores (los tags quedan). Antes de borrar espera
# unos minutos para que Supabase anote las descargas de la versión vieja
# (contar_descargas_archivadas, cada 5 minutos) y el contador de la web no baje.

name: Dejar solo la última versión

on:
  release:
    types: [published]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Esperar a que se anoten las descargas
        run: sleep 420

      - name: Borrar las versiones anteriores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          ultima=$(gh release list --limit 1000 --json tagName,isDraft,isLatest --jq '.[] | select(.isDraft == false and .isLatest == true) | .tagName' | head -n 1)

          if [ -z "$ultima" ]; then
            echo "No hay una release pública marcada como última. Nada que borrar."
            exit 0
          fi

          echo "Queda: $ultima"

          # Los borradores no se tocan: puede ser una versión que se está armando.
          gh release list --limit 1000 --json tagName,isDraft,isLatest --jq '.[] | select(.isDraft == false and .isLatest == false) | .tagName' |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            gh release delete "$tag" --yes
            echo "Borrada: $tag"
          done
